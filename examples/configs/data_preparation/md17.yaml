# Example configuration preparing a dateset

# =============================================================================
# OUTPUT SETTINGS
# =============================================================================
outpath: ./ce             # Directory to save results
outfolder: datamod            # Subdirectory name for this experiment
nexp: 1                        # Experiment number (for multiple runs)
overwrite: False                # Overwrite existing results
output_to_file: False           # Save training logs to file

# =============================================================================
# DATA CONFIGURATION
# =============================================================================
datamodule_type: COORDINATES   # Data type: COORDINATES, COLVAR
datamodule_args:
    # Data reader configuration
    datareader_type: MD17 
    datareader_args:
        molecule_name: "aspirin"        # Molecule name (e.g., aspirin, benzene, ethanol)
        parallel : False                     # Use parallel processing for data reading

    # Dataset parameters
    max_frames: 100           # Number of frames to use from trajectory
    sequential: False          # Random sampling (True for sequential frames)

    # Train/validation split
    train_size: 80           # Number of training frames
    validation_size: 10      # Number of validation frames
    batch_size: 2            # Training batch size
    val_batch_size: 2        # Validation batch size

    # test_full_dataset: True   # Use full dataset for testing (True)
    test_size: 10            
    test_batch_size: 10       # Testing batch size

    # Datasets
    dataset_type: "BONDGRAPH"   # Feature type: DISTANCES, POSITIONS, SOAP
    dataset_args:
        precompute_graphs: True   # Precompute bond graphs (True for small datasets, False for large datasets)
        parallel: False              # Use parallel processing for dataset creation
    
    # dataset_type: "POSITIONS"   # Feature type: DISTANCES, POSITIONS, SOAP
    # dataset_args:
    #     group1: "0:10"          # First group of atoms for distance calculation
    #     group2: "0:10"          # Second group of atoms for distance calculation

    # Data processing
    num_workers: 4             # Number of parallel data loading workers
    norm_type: "minmax"        # Normalization: minmax, standard, none
